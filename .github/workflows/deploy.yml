name: Deploy Portfolio Site to Static.app

on:
  push:
    branches:
      - main # Triggers whenever you push changes to your main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down your raw HTML and asset folders from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Hand the files directly to Static.app (since no build step is needed!)
      - name: Deploy to Static.app
        uses: designmodo/static-app-deploy-action@v1.0.0
        with:
          api-key: ${{ secrets.STATIC_APP_API_KEY }}
          pid: "aenk72fg8j"
