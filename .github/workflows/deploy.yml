name: Deploy Plain Portfolio Site to Static.app

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Pull down repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Clean Deployment Folder
        run: |
          mkdir deploy_package
          cp -r index.html favicon.ico assets deploy_package/

      # Direct Static.app's tool to upload ONLY your verified subfolder files
      - name: Deploy to Static.app
        uses: designmodo/static-app-deploy-action@v1.0.0
        with:
          api-key: ${{ secrets.STATIC_APP_API_KEY }}
          pid: "aenk72fg8j"
          # This tells the script to bypass root directory and upload from the package folder
          build-dir: "./deploy_package"
