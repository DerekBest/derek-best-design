name: Build and Deploy to Static.app

on:
  push:
    branches:
      - main # Triggers the build every time you push code to your main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down the source code from your repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Boot up Node.js on the deployment server
      - name: Set up Node.js
        uses: actions/workspace-node@v4
        with:
          node-version: 18

      # 3. Download dependencies (Sass, Eleventy, etc.)
      - name: Install Dependencies
        run: npm install --no-engine-strict

      # 4. Run your Eleventy build to generate the "_site" folder
      - name: Build Eleventy Site
        run: npm run build

      # 5. Hand the "_site" directory over to Static.app natively
      - name: Deploy to Static.app
        uses: designmodo/static-app-deploy-action@v1.0.0
        with:
          api-key: ${{ secrets.STATIC_APP_API_KEY }}
          domain: "derekbest.design"
