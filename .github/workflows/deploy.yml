name: Deploy Portfolio Site to Static.app

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Pull down repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Install standard project packages (including 11ty and Sass)
      - name: Install Dependencies
        run: npm ci

      # Build production templates and compile SCSS
      - name: Compile 11ty Site
        run: npm run build

      # Direct Static.app's tool to upload ONLY compiled production files
      - name: Deploy to Static.app
        uses: designmodo/static-app-deploy-action@v1.0.0
        with:
          api-key: ${{ secrets.STATIC_APP_API_KEY }}
          pid: "aenk72fg8j"
          # Points directly to the build output directory generated by Eleventy
          build-dir: "./_site"
