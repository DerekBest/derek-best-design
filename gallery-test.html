<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiple Galleries with Thumbnails and Toggleable Captions</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
  }

  .gallery-container {
    margin: 20px;
    border: 1px solid #ddd;
    padding: 10px;
  }

  .thumbnails-container {
    overflow: hidden;
    position: relative;
  }

  .thumbnails {
    display: flex;
    transition: transform 0.3s ease-in-out;
  }

  .thumbnail {
    width: 100px;
    height: 100px;
    object-fit: cover;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.3s ease-in-out;
  }

  .thumbnail.active {
    border-color: #3498db;
  }

  .main-image {
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    margin-top: 10px;
  }

  .main-image img {
    max-width: 100%;
    max-height: 100%;
    opacity: 0;
    transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
  }

  .main-image-container.active img {
    transform: scale(1.1);
    opacity: 1;
  }

  .caption {
    text-align: center;
    padding: 10px;
    display: none;
  }

  .caption.active {
    display: block;
  }

  .caption-button {
    cursor: pointer;
    text-decoration: underline;
  }

  .scroll-button {
    cursor: pointer;
    font-size: 18px;
    margin: 0 10px;
  }
</style>
</head>
<body>
<div class="gallery-container">
  <div class="thumbnails-container">
    <div class="thumbnails" id="gallery1">
      <span><img class="thumbnail" src="assets/img/sandia-home.jpg" alt="Thumbnail 1" data-caption="Caption 1"></span>
      <img class="thumbnail" src="assets/img/70-ways.jpg" alt="Thumbnail 2" data-caption="Caption 2">
      <img class="thumbnail" src="assets/img/careers.jpg" alt="Thumbnail 3" data-caption="Caption 3">
      <img class="thumbnail" src="assets/img/cee.jpg" alt="Thumbnail 4" data-caption="Caption 4">
    </div>
  </div>
  <div class="main-image">
    <div class="main-image-container">
    <img class="main" src="assets/img/sandia-home.jpg" alt="Main Image">
</div>
    <div class="caption active">
      <p class="caption-text"></p>
      <p class="caption-button">Minimize</p>
    </div>
  </div>
  <button class="scroll-button left">&lt;</button>
  <button class="scroll-button right">&gt;</button>
</div>

<div class="gallery-container">
  <div class="thumbnails-container">
    <div class="thumbnails" id="gallery2">
      <span><img class="thumbnail" src="assets/img/digital-guide.jpg" alt="Thumbnail 5" data-caption="Caption 5"></span>
      <img class="thumbnail" src="assets/img/lab-news.jpg" alt="Thumbnail 6" data-caption="Caption 6">
      <img class="thumbnail" src="assets/img/los.jpg" alt="Thumbnail 7" data-caption="Caption 7">
      <img class="thumbnail" src="assets/img/mobiles.jpg" alt="Thumbnail 8" data-caption="Caption 8">
    </div>
  </div>
  <div class="main-image">
    <div class="main-image-container">
    <img class="main" src="assets/img/digital-guide.jpg" alt="Main Image">
</div>
    <div class="caption active">
      <p class="caption-text"></p>
      <p class="caption-button">Minimize</p>
    </div>
  </div>
  <button class="scroll-button left">&lt;</button>
  <button class="scroll-button right">&gt;</button>
</div>

<script>
const galleryContainers = document.querySelectorAll('.gallery-container');

galleryContainers.forEach(container => {
  const thumbnailsContainer = container.querySelector('.thumbnails-container');
  const thumbnails = container.querySelector('.thumbnails');
  const mainImageContainer = container.querySelector('.main-image-container');
  const mainImage = container.querySelector('.main');
  const caption = container.querySelector('.caption');
  const captionText = container.querySelector('.caption-text');
  const captionButton = container.querySelector('.caption-button');
  const scrollButtons = container.querySelectorAll('.scroll-button');

  const defaultThumbnail = thumbnails.querySelector('.thumbnail');
  const defaultCaptionContent = defaultThumbnail.getAttribute('data-caption');

  // Set the default thumbnail as active and update caption
  defaultThumbnail.classList.add('active');
  captionText.textContent = defaultCaptionContent;
  captionButton.textContent = 'Minimize';

  // Update the main image source to the default thumbnail
  const defaultImageSrc = defaultThumbnail.src;
  mainImage.src = defaultImageSrc;
  
  // Apply active state to the main image container
  mainImageContainer.classList.add('active');

  let currentThumbnailIndex = 0;
  const thumbnailWidth = defaultThumbnail.offsetWidth;
  const maxIndex = thumbnails.childElementCount - 1;

  // Scroll the thumbnails to the specified index
  const scrollToThumbnail = index => {
    if (index < 0) index = 0;
    if (index > maxIndex) index = maxIndex;
    currentThumbnailIndex = index;
    thumbnails.style.transform = `translateX(-${thumbnailWidth * currentThumbnailIndex}px)`;
  };

  scrollButtons.forEach(button => {
    button.addEventListener('click', () => {
      if (button.classList.contains('left')) {
        scrollToThumbnail(currentThumbnailIndex - 1);
      } else if (button.classList.contains('right')) {
        scrollToThumbnail(currentThumbnailIndex + 1);
      }
    });
  });

  thumbnails.addEventListener('click', event => {
    if (event.target.classList.contains('thumbnail')) {
      const clickedThumbnail = event.target;
      const clickedIndex = Array.from(thumbnails.children).indexOf(clickedThumbnail);
      scrollToThumbnail(clickedIndex);
      
      // Update caption and thumbnail active state here
      thumbnails.querySelectorAll('.thumbnail').forEach(thumbnail => {
        thumbnail.classList.remove('active');
      });
      clickedThumbnail.classList.add('active');
      captionText.textContent = clickedThumbnail.getAttribute('data-caption');
      caption.classList.add('active');
      captionButton.textContent = 'Minimize';
      
      // Apply active state to the main image container
      mainImageContainer.classList.add('active');

      // Update the main image source
      const newImageSrc = clickedThumbnail.src;
      mainImage.src = newImageSrc;
    }
  });

  captionButton.addEventListener('click', () => {
    caption.classList.toggle('active');
    captionButton.textContent = caption.classList.contains('active') ? 'Minimize' : 'Maximize';
  });
});
</script>
</body>
</html>
